<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f3faf7"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eefaf7"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#213047" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 54px 'Arial', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #475569; }
      .boxTitle { font: 700 26px 'Arial', sans-serif; fill: #0f172a; }
      .boxText { font: 400 20px 'Arial', sans-serif; fill: #334155; }
      .caption { font: 700 20px 'Arial', sans-serif; fill: #0f766e; }
      .tiny { font: 400 18px 'Arial', sans-serif; fill: #64748b; }
      .mono { font: 700 18px 'Courier New', monospace; fill: #0f172a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="70" y="92" class="title">Depth to Voxblox ESDF Pipeline</text>
  <text x="70" y="130" class="subtitle">The recorded phone session becomes a replayable RGBD + pose source for TSDF integration, ESDF extraction and visualization.</text>

  <g transform="translate(60,190)" filter="url(#shadow)">
    <rect x="0" y="0" rx="26" ry="26" width="238" height="168" fill="url(#boxA)" stroke="#b7e4dc"/>
    <text x="28" y="44" class="boxTitle">1. VLPREC dataset</text>
    <text x="28" y="82" class="boxText">Per-frame payload stores:</text>
    <text x="28" y="114" class="boxText">RGB JPEG, depth, pose, intrinsics</text>
    <text x="28" y="144" class="mono">vlp_stream.rec</text>

    <rect x="310" y="0" rx="26" ry="26" width="258" height="168" fill="url(#boxA)" stroke="#b7e4dc"/>
    <text x="338" y="44" class="boxTitle">2. Replay / decode</text>
    <text x="338" y="82" class="boxText">`mono_vio_ws_stream_client`</text>
    <text x="338" y="114" class="boxText">loads JPEG, depth and camera pose</text>
    <text x="338" y="144" class="boxText">with original timestamps</text>

    <rect x="620" y="0" rx="26" ry="26" width="260" height="168" fill="url(#boxA)" stroke="#b7e4dc"/>
    <text x="648" y="44" class="boxTitle">3. Synchronize frame</text>
    <text x="648" y="82" class="boxText">Depth stays metric and aligned</text>
    <text x="648" y="114" class="boxText">Pose + intrinsics are attached</text>
    <text x="648" y="144" class="boxText">for each RGBD observation</text>

    <rect x="932" y="0" rx="26" ry="26" width="312" height="168" fill="url(#boxB)" stroke="#fdba74"/>
    <text x="960" y="44" class="boxTitle">4. Voxblox TSDF integration</text>
    <text x="960" y="82" class="boxText">Fuse depth rays into a signed</text>
    <text x="960" y="114" class="boxText">distance volume in world frame</text>
    <text x="960" y="144" class="boxText">with the VIO trajectory</text>
  </g>

  <g stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <line x1="300" y1="274" x2="352" y2="274"/>
    <line x1="570" y1="274" x2="622" y2="274"/>
    <line x1="882" y1="274" x2="934" y2="274"/>
  </g>

  <g transform="translate(78,420)">
    <text x="0" y="0" class="caption">Observed signals during replay</text>
    <g transform="translate(0,30)" filter="url(#shadow)">
      <rect x="0" y="0" rx="22" ry="22" width="328" height="214" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="28" y="42" class="boxTitle">Color</text>
      <rect x="28" y="60" width="272" height="126" rx="16" fill="#729fc9"/>
      <path d="M44 174 C92 118 152 122 240 92 C260 84 276 78 294 74" stroke="#f8fafc" stroke-width="4" fill="none" opacity="0.65"/>
      <text x="28" y="198" class="tiny">JPEG decode for visualization and logging</text>
    </g>
    <g transform="translate(366,30)" filter="url(#shadow)">
      <rect x="0" y="0" rx="22" ry="22" width="328" height="214" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="28" y="42" class="boxTitle">Depth</text>
      <rect x="28" y="60" width="272" height="126" rx="16" fill="#1e3a8a"/>
      <circle cx="154" cy="122" r="64" fill="#22d3ee" opacity="0.55"/>
      <rect x="118" y="104" width="92" height="88" fill="#fde047" opacity="0.46"/>
      <text x="28" y="198" class="tiny">Metric depth used for TSDF / ESDF update</text>
    </g>
    <g transform="translate(732,30)" filter="url(#shadow)">
      <rect x="0" y="0" rx="22" ry="22" width="328" height="214" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="28" y="42" class="boxTitle">Pose</text>
      <rect x="28" y="60" width="272" height="126" rx="16" fill="#0f172a"/>
      <path d="M72 160 L124 118 L164 134 L198 96 L252 120" stroke="#fb923c" stroke-width="5" fill="none"/>
      <line x1="76" y1="158" x2="76" y2="102" stroke="#22c55e" stroke-width="4"/>
      <line x1="76" y1="158" x2="120" y2="158" stroke="#ef4444" stroke-width="4"/>
      <line x1="76" y1="158" x2="56" y2="178" stroke="#38bdf8" stroke-width="4"/>
      <text x="28" y="198" class="tiny">6DoF camera trajectory in a stable world frame</text>
    </g>
  </g>

  <g transform="translate(1110,438)" filter="url(#shadow)">
    <rect x="0" y="0" rx="26" ry="26" width="232" height="244" fill="#fff7ed" stroke="#fdba74"/>
    <text x="26" y="42" class="boxTitle">Outputs</text>
    <text x="26" y="84" class="boxText">TSDF volume</text>
    <text x="26" y="116" class="boxText">ESDF cloud</text>
    <text x="26" y="148" class="boxText">2D ESDF slice</text>
    <text x="26" y="180" class="boxText">Web viewer updates</text>
    <text x="26" y="216" class="tiny">Useful for local mapping, planning and debugging</text>
  </g>

  <g stroke="#ea580c" stroke-width="5" fill="none" marker-end="url(#arrowOrange)">
    <path d="M1034 274 C1086 292 1132 328 1160 400"/>
  </g>
</svg>
