<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VLP C++ Web Visualizer</title>
  <style>
    html,body{margin:0;height:100%;background:#101216;color:#e6e6e6;font-family:sans-serif}
    #root{display:grid;grid-template-columns:25% 75%;height:100%}
    #left{padding:8px;box-sizing:border-box}
    #img{width:100%;border:1px solid #333}
    #meta{margin-top:8px;font-size:14px;line-height:1.4}
    #view{width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <div id="root">
    <div id="left">
      <img id="img" alt="stream"/>
      <div id="meta">
        <div id="status">connecting...</div>
        <div id="fps">fps: 0</div>
        <div id="pose">pose: (0,0,0)</div>
        <div id="scale">scale: n/a</div>
      </div>
    </div>
    <canvas id="view"></canvas>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

    const wsUrl = `ws://${location.host}/ws`;
    const img = document.getElementById('img');
    const statusEl = document.getElementById('status');
    const fpsEl = document.getElementById('fps');
    const poseEl = document.getElementById('pose');
    const scaleEl = document.getElementById('scale');

    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101216);
    const cam = new THREE.PerspectiveCamera(60,1,0.01,2000);
    cam.position.set(0,-2,-2);
    const controls = new OrbitControls(cam, canvas);
    controls.target.set(0,0,0);
    controls.update();
    scene.add(new THREE.AxesHelper(0.5));
    scene.add(new THREE.GridHelper(10,20));

    const trajGeom = new THREE.BufferGeometry();
    const trajLine = new THREE.Line(trajGeom,new THREE.LineBasicMaterial({color:0xff5555}));
    scene.add(trajLine);
    const posePt = new THREE.Mesh(new THREE.SphereGeometry(0.03,12,12), new THREE.MeshBasicMaterial({color:0x66ff66}));
    scene.add(posePt);
    const cloudGroup = new THREE.Group(); scene.add(cloudGroup);

    function resize(){
      const w=canvas.clientWidth,h=canvas.clientHeight;
      if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    }
    function loop(){
      resize();
      if (controls.enabled) controls.update();
      renderer.render(scene,cam);
      requestAnimationFrame(loop);
    }
    loop();

    function setTraj(t){
      const arr=new Float32Array(t.length*3);
      for(let i=0;i<t.length;i++){arr[3*i]=t[i][0];arr[3*i+1]=t[i][1];arr[3*i+2]=t[i][2];}
      trajGeom.setAttribute('position',new THREE.BufferAttribute(arr,3));
      trajGeom.computeBoundingSphere();
      if(t.length){const p=t[t.length-1];posePt.position.set(p[0],p[1],p[2]);}
    }
    function setClouds(clouds){
      while(cloudGroup.children.length) cloudGroup.remove(cloudGroup.children[0]);
      for(const c of clouds){
        const pts=c.points||[]; if(!pts.length) continue;
        const arr=new Float32Array(pts.length*3);
        const col=new Float32Array(pts.length*3);
        for(let i=0;i<pts.length;i++){
          arr[3*i]=pts[i][0];arr[3*i+1]=pts[i][1];arr[3*i+2]=pts[i][2];
          col[3*i]=pts[i][3]??0.302;col[3*i+1]=pts[i][4]??0.733;col[3*i+2]=pts[i][5]??1.0;
        }
        const g=new THREE.BufferGeometry();
        g.setAttribute('position',new THREE.BufferAttribute(arr,3));
        g.setAttribute('color',new THREE.BufferAttribute(col,3));
        cloudGroup.add(new THREE.Points(g,new THREE.PointsMaterial({size:0.01,vertexColors:true})));
      }
    }

    let ws = null;
    let reconnectTimer = null;
    function connectWs(){
      statusEl.textContent='connecting: '+wsUrl;
      ws = new WebSocket(wsUrl);
      ws.onopen = ()=>statusEl.textContent='connected: '+wsUrl;
      ws.onclose = ()=>{
        statusEl.textContent='closed, reconnecting...';
        if(!reconnectTimer) reconnectTimer = setTimeout(()=>{reconnectTimer=null; connectWs();}, 1000);
      };
      ws.onerror = ()=>statusEl.textContent='ws error';
      ws.onmessage = (ev)=>{
        const d = JSON.parse(ev.data);
        if(d.image_jpeg_b64) img.src='data:image/jpeg;base64,'+d.image_jpeg_b64;
        fpsEl.textContent='fps: '+(d.fps||0).toFixed(2);
        const p=d.pose||{tx:0,ty:0,tz:0};
        poseEl.textContent=`pose: (${p.tx.toFixed(3)}, ${p.ty.toFixed(3)}, ${p.tz.toFixed(3)})`;
        scaleEl.textContent=d.scale_text||'scale: n/a';
        setTraj(d.trajectory||[]);
        setClouds(d.depth_clouds||[]);
      };
    }
    connectWs();
  </script>
</body>
</html>
