<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VLP C++ Web Visualizer</title>
  <style>
    html,body{margin:0;height:100%;background:#101216;color:#e6e6e6;font-family:sans-serif}
    #root{display:grid;grid-template-columns:25% 75%;height:100%}
    #left{padding:8px;box-sizing:border-box}
    #img{width:100%;border:1px solid #333}
    #esdf2d{width:100%;border:1px solid #333;margin-top:8px;image-rendering:pixelated}
    #meta{margin-top:8px;font-size:14px;line-height:1.4}
    #view{width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <div id="root">
    <div id="left">
      <img id="img" alt="stream"/>
      <div id="meta">
        <div id="status">connecting...</div>
        <div id="fps">fps: 0</div>
        <div id="pose">pose: (0,0,0)</div>
        <div id="scale">scale: n/a</div>
        <div id="vox">voxblox: off</div>
        <div id="cloud">cloud: 0</div>
        <div id="esdf2dMeta">esdf2d: n/a</div>
        <div>
          <label for="esdfColorMode">ESDF Color:</label>
          <select id="esdfColorMode">
            <option value="input">By distance</option>
            <option value="constant">Constant</option>
            <option value="height">By Height (Y, -1..2)</option>
          </select>
        </div>
        <div>
          <label><input type="checkbox" id="followCam"> follow camera</label>
        </div>
      </div>
      <canvas id="esdf2d" width="256" height="256"></canvas>
    </div>
    <canvas id="view"></canvas>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

    const wsUrl = `ws://${location.host}/ws`;
    const img = document.getElementById('img');
    const statusEl = document.getElementById('status');
    const fpsEl = document.getElementById('fps');
    const poseEl = document.getElementById('pose');
    const scaleEl = document.getElementById('scale');
    const voxEl = document.getElementById('vox');
    const cloudEl = document.getElementById('cloud');
    const esdf2dMetaEl = document.getElementById('esdf2dMeta');
    const esdf2dCanvas = document.getElementById('esdf2d');
    const esdf2dCtx = esdf2dCanvas.getContext('2d');
    const esdf2dOff = document.createElement('canvas');
    const esdf2dOffCtx = esdf2dOff.getContext('2d');
    const esdfColorModeEl = document.getElementById('esdfColorMode');
    const followCamEl = document.getElementById('followCam');

    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101216);
    const cam = new THREE.PerspectiveCamera(60,1,0.01,2000);
    cam.position.set(0,-2,-2);
    const controls = new OrbitControls(cam, canvas);
    controls.target.set(0,0,0);
    controls.update();
    scene.add(new THREE.AxesHelper(1.0));
    scene.add(new THREE.GridHelper(10,20));

    const trajGeom = new THREE.BufferGeometry();
    const trajLine = new THREE.Line(trajGeom,new THREE.LineBasicMaterial({color:0xff5555}));
    scene.add(trajLine);
    const trajPts = new THREE.Points(
      trajGeom,
      new THREE.PointsMaterial({ color:0xff5555, size:0.035, sizeAttenuation:true })
    );
    scene.add(trajPts);

    function makePoseAxisTriad(size=0.18, shaftR=0.008, headR=0.018, headLen=0.04){
      const g = new THREE.Group();
      const makeAxis = (color, axis) => {
        const m = new THREE.MeshBasicMaterial({color});
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftR, shaftR, size, 10), m);
        const head = new THREE.Mesh(new THREE.ConeGeometry(headR, headLen, 12), m);
        if(axis === 'x'){
          shaft.rotation.z = -Math.PI/2;
          shaft.position.x = size * 0.5;
          head.rotation.z = -Math.PI/2;
          head.position.x = size + headLen * 0.5;
        } else if(axis === 'y'){
          shaft.position.y = size * 0.5;
          head.position.y = size + headLen * 0.5;
        } else { // z
          shaft.rotation.x = Math.PI/2;
          shaft.position.z = size * 0.5;
          head.rotation.x = Math.PI/2;
          head.position.z = size + headLen * 0.5;
        }
        g.add(shaft); g.add(head);
      };
      makeAxis(0xff3333, 'x');
      makeAxis(0x33ff33, 'y');
      makeAxis(0x3388ff, 'z');
      return g;
    }
    const poseAxes = makePoseAxisTriad();
    scene.add(poseAxes);
    const esdfGroup = new THREE.Group(); scene.add(esdfGroup);
    let depthCloudObj = null;
    let latestPose = {x:0,y:0,z:0};
    let prevPose = {x:0,y:0,z:0};
    let wasFollowEnabled = false;

    function resize(){
      const w=canvas.clientWidth,h=canvas.clientHeight;
      if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    }
    function loop(){
      resize();
      if (controls.enabled) controls.update();
      renderer.render(scene,cam);
      requestAnimationFrame(loop);
    }
    loop();

    function setTraj(t, pose){
      const arr=new Float32Array(t.length*3);
      for(let i=0;i<t.length;i++){arr[3*i]=t[i][0];arr[3*i+1]=t[i][1];arr[3*i+2]=t[i][2];}
      trajGeom.setAttribute('position',new THREE.BufferAttribute(arr,3));
      trajGeom.computeBoundingSphere();
      if(t.length){
        const p=t[t.length-1];
        poseAxes.position.set(p[0],p[1],p[2]);
        latestPose = {x:p[0], y:p[1], z:p[2]};
      }
      if(pose && Number.isFinite(pose.qx) && Number.isFinite(pose.qy) &&
         Number.isFinite(pose.qz) && Number.isFinite(pose.qw)) {
        poseAxes.quaternion.set(pose.qx, pose.qy, pose.qz, pose.qw);
      }
      const followEnabled = !!(followCamEl && followCamEl.checked);
      if(followEnabled && !wasFollowEnabled){
        prevPose = {x:latestPose.x, y:latestPose.y, z:latestPose.z};
      }
      if(followEnabled){
        const dx = latestPose.x - prevPose.x;
        const dy = latestPose.y - prevPose.y;
        const dz = latestPose.z - prevPose.z;
        cam.position.set(cam.position.x + dx, cam.position.y + dy, cam.position.z + dz);
        controls.target.set(controls.target.x + dx, controls.target.y + dy, controls.target.z + dz);
      }
      wasFollowEnabled = followEnabled;
      prevPose = {x:latestPose.x, y:latestPose.y, z:latestPose.z};
    }

    function clearGroup(group){
      while(group.children.length) group.remove(group.children[0]);
    }

    function makeJetColorRgb(t){
      const id = Math.max(0.0, Math.min(1.0, t));
      if(id <= 0.0) return [0.0, 0.0, 128.0/255.0];
      if(id >= 1.0) return [128.0/255.0, 0.0, 0.0];
      const x = id * 8.0;
      const lvl = Math.floor(x);
      const tmp = x - lvl;
      if(lvl === 0) return [0.0, 0.0, (255.0*(0.5+0.5*tmp))/255.0];
      if(lvl === 1) return [0.0, (255.0*(0.5*tmp))/255.0, 1.0];
      if(lvl === 2) return [0.0, (255.0*(0.5+0.5*tmp))/255.0, 1.0];
      if(lvl === 3) return [(255.0*(0.5*tmp))/255.0, 1.0, (255.0*(1.0-0.5*tmp))/255.0];
      if(lvl === 4) return [(255.0*(0.5+0.5*tmp))/255.0, 1.0, (255.0*(0.5-0.5*tmp))/255.0];
      if(lvl === 5) return [1.0, (255.0*(1.0-0.5*tmp))/255.0, 0.0];
      if(lvl === 6) return [1.0, (255.0*(0.5-0.5*tmp))/255.0, 0.0];
      return [(255.0*(1.0-0.5*tmp))/255.0, 0.0, 0.0];
    }

    function setEsdfPoints(pts, voxelSizeM){
      clearGroup(esdfGroup);
      const points = pts || [];
      if(!points.length) return;
      const cubeSize = Math.max(0.02, (voxelSizeM || 0.1) * 0.5);
      const geom = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
      const modeStr = esdfColorModeEl ? esdfColorModeEl.value : 'input';
      const mode = (modeStr === 'constant') ? 1 : ((modeStr === 'height') ? 2 : 0);

      if(mode === 0){
        for(let i=0;i<points.length;i++){
          const p = points[i];
          const r = (p.length >= 6 ? Math.max(0,Math.min(255,p[3])) : 102) / 255.0;
          const g = (p.length >= 6 ? Math.max(0,Math.min(255,p[4])) : 204) / 255.0;
          const b = (p.length >= 6 ? Math.max(0,Math.min(255,p[5])) : 255) / 255.0;
          const mat = new THREE.MeshBasicMaterial({ color:new THREE.Color(r,g,b) });
          const cube = new THREE.Mesh(geom, mat);
          cube.position.set(p[0], p[1], p[2]);
          esdfGroup.add(cube);
        }
      } else if(mode === 1){
        const mat = new THREE.MeshBasicMaterial({ color:new THREE.Color(60/255.0, 200/255.0, 80/255.0) });
        for(let i=0;i<points.length;i++){
          const p = points[i];
          const cube = new THREE.Mesh(geom, mat.clone());
          cube.position.set(p[0], p[1], p[2]);
          esdfGroup.add(cube);
        }
      } else {
        for(let i=0;i<points.length;i++){
          const p = points[i];
          const h = p[1];
          const t = Math.max(0.0, Math.min(1.0, (h + 2.0) / 4.0));
          const c = makeJetColorRgb(t);
          const mat = new THREE.MeshBasicMaterial({ color:new THREE.Color(c[0],c[1],c[2]) });
          const cube = new THREE.Mesh(geom, mat);
          cube.position.set(p[0], p[1], p[2]);
          esdfGroup.add(cube);
        }
      }
    }

    function setDepthCloudPoints(pts){
      if(depthCloudObj){
        scene.remove(depthCloudObj);
        depthCloudObj.geometry.dispose();
        depthCloudObj.material.dispose();
        depthCloudObj = null;
      }
      const points = pts || [];
      if(!points.length) return;
      const pos = new Float32Array(points.length * 3);
      const col = new Float32Array(points.length * 3);
      for(let i=0;i<points.length;i++){
        const p = points[i];
        pos[3*i] = p[0]; pos[3*i+1] = p[1]; pos[3*i+2] = p[2];
        col[3*i] = (p.length >= 6 ? p[3] : 180) / 255.0;
        col[3*i+1] = (p.length >= 6 ? p[4] : 180) / 255.0;
        col[3*i+2] = (p.length >= 6 ? p[5] : 180) / 255.0;
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size:0.04,
        vertexColors:true,
      });
      depthCloudObj = new THREE.Points(geom, mat);
      scene.add(depthCloudObj);
      cloudEl.textContent = `cloud: ${points.length}`;
    }

    function distToRgb(v, maxAbs){
      if(v === null || v === undefined || !Number.isFinite(v)) return [10,10,10];
      const t = Math.max(-1.0, Math.min(1.0, v / Math.max(1e-4, maxAbs)));
      if(t < 0){
        const a = Math.round(255 * (-t));
        return [255, 255 - a, 255 - a];
      }
      const a = Math.round(255 * t);
      return [255 - a, 255, 255 - a];
    }

    function setEsdf2D(esdf2d){
      if(!esdf2d || !esdf2d.width || !esdf2d.height || !Array.isArray(esdf2d.distances)){
        esdf2dMetaEl.textContent = 'esdf2d: n/a';
        esdf2dCtx.clearRect(0,0,esdf2dCanvas.width,esdf2dCanvas.height);
        return;
      }
      const w = esdf2d.width|0;
      const h = esdf2d.height|0;
      const vals = esdf2d.distances;
      let maxAbs = 0.1;
      for(let i=0;i<vals.length;i++){
        const v = vals[i];
        if(Number.isFinite(v)) maxAbs = Math.max(maxAbs, Math.abs(v));
      }
      const imgData = esdf2dCtx.createImageData(w, h);
      for(let i=0;i<w*h;i++){
        const rgb = distToRgb(vals[i], maxAbs);
        const j = i*4;
        imgData.data[j] = rgb[0];
        imgData.data[j+1] = rgb[1];
        imgData.data[j+2] = rgb[2];
        imgData.data[j+3] = 255;
      }
      esdf2dOff.width = w;
      esdf2dOff.height = h;
      esdf2dOffCtx.putImageData(imgData,0,0);
      esdf2dCtx.clearRect(0,0,esdf2dCanvas.width,esdf2dCanvas.height);
      esdf2dCtx.drawImage(esdf2dOff, 0, 0, esdf2dCanvas.width, esdf2dCanvas.height);
      esdf2dMetaEl.textContent =
          `esdf2d: ${w}x${h} h=${(esdf2d.plane_height_m||0).toFixed(2)}m res=${(esdf2d.resolution_m||0).toFixed(3)}m`;
    }

    let ws = null;
    let reconnectTimer = null;
    function connectWs(){
      statusEl.textContent='connecting: '+wsUrl;
      ws = new WebSocket(wsUrl);
      ws.onopen = ()=>statusEl.textContent='connected: '+wsUrl;
      ws.onclose = ()=>{
        statusEl.textContent='closed, reconnecting...';
        if(!reconnectTimer) reconnectTimer = setTimeout(()=>{reconnectTimer=null; connectWs();}, 1000);
      };
      ws.onerror = ()=>statusEl.textContent='ws error';
      ws.onmessage = (ev)=>{
        const d = JSON.parse(ev.data);
        if(d.image_jpeg_b64) img.src='data:image/jpeg;base64,'+d.image_jpeg_b64;
        fpsEl.textContent='fps: '+(d.fps||0).toFixed(2);
        const p=d.pose||{tx:0,ty:0,tz:0,qx:0,qy:0,qz:0,qw:1};
        poseEl.textContent=`pose: (${p.tx.toFixed(3)}, ${p.ty.toFixed(3)}, ${p.tz.toFixed(3)})`;
        scaleEl.textContent=d.scale_text||'scale: n/a';
        const v=d.voxblox||{};
        voxEl.textContent=`voxblox: ${v.enabled?'on':'off'} frames=${v.integrated_frames||0} tsdf=${v.tsdf_count||0} esdf=${v.esdf_count||0}`;
        setTraj(d.trajectory||[], p);
        if (Object.prototype.hasOwnProperty.call(d, 'depth_clouds')) {
          setDepthCloudPoints(d.depth_clouds || []);
        } else {
          cloudEl.textContent = 'cloud: n/a';
        }
        if (Object.prototype.hasOwnProperty.call(d, 'esdf_points')) {
          setEsdfPoints(d.esdf_points || [], v.voxel_size_m || 0.1);
        }
        if (Object.prototype.hasOwnProperty.call(d, 'esdf2d')) {
          setEsdf2D(d.esdf2d);
        }
      };
    }
    connectWs();
  </script>
</body>
</html>
